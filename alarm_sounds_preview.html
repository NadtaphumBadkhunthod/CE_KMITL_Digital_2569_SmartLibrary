<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alarm Sounds</title>
<style>
:root { --text:#403C3C; --muted:rgba(64,60,60,.85); --pink:#E7C4BE; --danger:#B5584C; --beige:rgba(235,225,216,.7); --bg:#F6F4F2; }
* { box-sizing:border-box; margin:0 }
body { font-family:"Leelawadee UI","Sarabun",system-ui,sans-serif; background:var(--bg); color:var(--text); padding:32px 16px; }
main { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:14px }
h1 { font-weight:400; font-size:30px }
.lead { color:var(--muted); margin-bottom:8px }
.opt { display:flex; align-items:center; gap:16px; padding:16px 18px; background:#fff; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); border:2px solid transparent; transition:border-color .2s }
.opt.playing { border-color:var(--danger) }
.num { width:36px; height:36px; flex:none; border-radius:50%; background:var(--beige); display:grid; place-items:center; font-size:18px }
.opt.playing .num { background:var(--danger); color:#fff }
.info { flex:1; min-width:0 }
.info b { display:block; font-weight:500; font-size:19px }
.info small { color:var(--muted); font-size:14px; line-height:1.4 }
button { font:inherit; border:0; cursor:pointer; border-radius:999px; padding:10px 20px; background:var(--pink); color:var(--text); min-width:92px }
.opt.playing button { background:var(--danger); color:#fff }
.stop { align-self:flex-start; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.12) }
</style>
</head>
<body>
<main>
  <h1>เสียงแจ้งเตือนไฟไหม้</h1>
  <p class="lead">กด Play เพื่อฟังทีละแบบ เสียงจะวนซ้ำเหมือนตอนแจ้งเตือนจริง กดอีกครั้งเพื่อหยุด แล้วบอกหมายเลขที่เลือก</p>
  <div id="list"></div>
  <button class="stop" id="stop">หยุดทั้งหมด</button>
</main>
<script>
let ctx = null;
const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());

// tone(start, dur, type, f0, f1): โทนเดียว ไล่ความถี่จาก f0 ไป f1 (ถ้ามี)
function tone(t, dur, type, f0, f1, vol = 0.5) {
  const a = ac(), osc = a.createOscillator(), g = a.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  if (f1) osc.frequency.linearRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.setValueAtTime(vol, t + dur - 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(a.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}

const SOUNDS = [
  { name: 'Hi-Lo (เสียงปัจจุบัน)', desc: 'สองโทนสูง-ต่ำสลับกัน 880 / 660 Hz แบบรถพยาบาลยุโรป', period: 1000,
    play: t => { tone(t, 0.42, 'square', 880); tone(t + 0.45, 0.42, 'square', 660) } },
  { name: 'Wail Siren', desc: 'ไซเรนรถดับเพลิง เสียงไต่ขึ้นแล้วลงช้า ๆ ต่อเนื่อง ฟังแล้วรู้ทันทีว่าฉุกเฉิน', period: 1600,
    play: t => { tone(t, 0.8, 'sawtooth', 600, 1400, 0.35); tone(t + 0.8, 0.8, 'sawtooth', 1400, 600, 0.35) } },
  { name: 'Yelp Siren', desc: 'ไซเรนเร็ว ไต่ขึ้นลงถี่ ๆ 4 รอบต่อวินาที เร่งร้อนกว่า Wail', period: 1000,
    play: t => { for (let i = 0; i < 4; i++) tone(t + i * 0.25, 0.25, 'sawtooth', 700, 1500, 0.35) } },
  { name: 'Fire Alarm (Temporal-3)', desc: 'จังหวะสัญญาณเตือนไฟไหม้มาตรฐานในอาคาร ดัง 3 ครั้งแล้วเว้น แบบกริ่งหนีไฟ', period: 3000,
    play: t => { for (let i = 0; i < 3; i++) tone(t + i * 0.6, 0.45, 'square', 1000, 0, 0.5) } },
  { name: 'Klaxon', desc: 'เสียงแตรเตือนภัย "อู๊-อ้า" ทุ้มและดุ แบบสัญญาณเตือนในเรือหรือโรงงาน', period: 1100,
    play: t => { tone(t, 0.7, 'sawtooth', 220, 520, 0.45) } },
  { name: 'Rapid Beep', desc: 'บี๊บสั้นถี่ 8 ครั้งต่อวินาที แบบเครื่องตรวจจับควันในบ้าน กดดันมาก', period: 1000,
    play: t => { for (let i = 0; i < 8; i++) tone(t + i * 0.125, 0.07, 'square', 1250, 0, 0.45) } },
];

let current = -1, timer = null;
function stopAll() {
  clearInterval(timer); timer = null; current = -1;
  if (ctx) { ctx.close(); ctx = null; }
  document.querySelectorAll('.opt').forEach(el => el.classList.remove('playing'));
  document.querySelectorAll('.opt button').forEach(b => b.textContent = 'Play');
}
function start(i) {
  const s = SOUNDS[i];
  stopAll(); current = i;
  const a = ac(); a.resume();
  const go = () => s.play(ac().currentTime + 0.05);
  go(); timer = setInterval(go, s.period);
  const el = document.querySelectorAll('.opt')[i];
  el.classList.add('playing'); el.querySelector('button').textContent = 'Stop';
}

document.getElementById('list').innerHTML = SOUNDS.map((s, i) => `
  <div class="opt"><span class="num">${i + 1}</span>
    <div class="info"><b>${s.name}</b><small>${s.desc}</small></div>
    <button data-i="${i}">Play</button></div>`).join('');
document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.dataset.i; current === i ? stopAll() : start(i);
});
document.getElementById('stop').onclick = stopAll;
</script>
</body>
</html>
